src = ["chanx_django"]
target-version = "py311"

[lint]
ignore = [
  "E501" # line too long, handled by black
]
select = ["B", "C90", "E", "F", "I", "N", "N", "PL", "Q", "UP", "W"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.per-file-ignores]
"test_*" = ["PLR2004"]
